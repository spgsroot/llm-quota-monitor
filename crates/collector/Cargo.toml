[package]
name = "quota-collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "quota-monitor"

[dependencies]
quota-common = { path = "../common" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt", "net", "signal", "sync", "time", "io-util"] }
serde_json = "1"
time = "0.3"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
