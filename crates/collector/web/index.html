<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Quota Monitor</title>
<style>
:root{color-scheme:light dark;--bg:#f3f5f7;--panel:#fff;--fg:#202939;--muted:#526079;--line:#d6dce5;--accent:#246bce;--warn:#835700;--bad:#b52b37;--good:#176644}
@media(prefers-color-scheme:dark){:root{--bg:#141a24;--panel:#1e2734;--fg:#edf2fa;--muted:#afbdd2;--line:#3a485c;--accent:#82b5ff;--warn:#ffcf6b;--bad:#ff9c9c;--good:#84dfb3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,34px);margin:0}p{margin:8px 0;color:var(--muted)}button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 18px;background:var(--panel);color:var(--accent);cursor:pointer}button:disabled{opacity:.6}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.notice{border-left:4px solid var(--warn);padding:12px 16px;margin:24px 0;background:var(--panel);color:var(--fg)}.statusline{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:16px 0}.badge{font-size:13px;font-weight:700;border:1px solid currentColor;border-radius:20px;padding:3px 10px;white-space:nowrap}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}#providers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h2{margin:0;font-size:21px;text-transform:capitalize;overflow-wrap:anywhere}.window{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.numbers{display:flex;justify-content:space-between;gap:12px;overflow-wrap:anywhere}.percent{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}progress{display:block;width:100%;height:10px;margin:10px 0;accent-color:var(--accent)}.reset{font-size:13px;overflow-wrap:anywhere}#error{color:var(--bad);min-height:1.5em}footer{font-size:13px;margin-top:28px;color:var(--muted)}@media(max-width:480px){main{padding:20px 14px}.card{padding:16px}header button{width:100%}}
</style>
<script src="/dashboard.js" defer></script>
</head>
<body><main>
<header><div><h1>LLM Quota Monitor</h1><p>Квоты в домашней сети</p></div><button id="refresh" type="button">Обновить</button></header>
<div class="statusline" aria-live="polite"><strong class="badge warn" id="connection">CONNECTING</strong><strong class="badge warn" id="freshness" hidden>STALE</strong><span id="age">Данные ещё не получены</span></div>
<p id="updated">Обновление коллектора: -</p><p id="checked">Последний успешный запрос: -</p>
<p id="error" role="status"></p>
<section id="providers" aria-label="Квоты провайдеров"><p id="empty">Ожидание коллектора…</p></section>
<footer>HTTP Pull · запрос каждые 30 секунд · при потере связи показаны последние полученные данные. OAuth-токены не передаются.</footer>
</main></body></html>
