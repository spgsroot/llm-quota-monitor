[package]
name = "quota-firmware"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "llm-quota-monitor"
path = "src/main.rs"
harness = false
test = false
bench = false

[dependencies]
quota-common = { path = "../common" }
log = "0.4"
esp-idf-svc = "0.53"
esp-idf-hal = "0.47.0"
mipidsi = "0.10.0"
embedded-graphics = "0.8.1"
embedded-hal = "1.0.0"
serde_json = "1"
heapless = "0.9"
time = "0.3"

[build-dependencies]
embuild = "0.33.5"
